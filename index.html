<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Store</title>
    <link rel="stylesheet" href="style.css" />
    <script src="main.js" defer></script>
  </head>
  <body>
    <header class="store-header">
      <div class="header-inner">
        <h1>My Store</h1>

        <form class="filters" id="filters" aria-label="Product filters">
          <div class="filter-row">
            <input id="search" type="search" placeholder="Search for products..." aria-label="Search for products" />
            <select id="category" aria-label="Category">
              <option value="all">All Categories</option>
              <option value="men's clothing">men's clothing</option>
              <option value="jewelery">jewelery</option>
              <option value="electronics" selected>electronics</option>
              <option value="women's clothing">women's clothing</option>
            </select>
            <input id="min-price" type="number" min="0" step="0.01" placeholder="Min Price" aria-label="Minimum price" />
            <input id="max-price" type="number" min="0" step="0.01" placeholder="Max Price" aria-label="Maximum price" />
            <button class="apply-button" type="submit">Apply Filters</button>
          </div>
          <select id="sort" aria-label="Sort products by price">
            <option value="default">Sort by Price</option>
            <option value="asc">Price: Low to High</option>
            <option value="desc">Price: High to Low</option>
          </select>
        </form>

        <section class="cart" aria-labelledby="cart-title">
          <h2 id="cart-title">Shopping Cart</h2>
          <div id="cart-items" aria-live="polite"><p class="empty-cart">Your cart is empty.</p></div>
          <p class="cart-total">Total Quantity: <span id="total-quantity">0</span></p>
          <p class="cart-total">Total Price: <span id="total-price">$0.00</span></p>
        </section>
      </div>
    </header>

    <main class="store-main">
      <div id="products" class="product-grid" aria-live="polite"></div>
      <nav class="pagination" aria-label="Product pages">
        <div class="page-buttons">
          <button id="previous" type="button">Previous</button>
          <span id="page-numbers"></span>
          <button id="next" type="button">Next</button>
        </div>
        <p id="page-info">Page 1 of 1</p>
      </nav>
    </main>

    <dialog id="details-dialog" aria-labelledby="details-title">
      <button type="button" class="dialog-close" id="close-details" aria-label="Close details">&times;</button>
      <img id="details-image" alt="" />
      <div class="dialog-content">
        <p id="details-category" class="details-category"></p>
        <h2 id="details-title"></h2>
        <p id="details-price" class="details-price"></p>
        <p id="details-description"></p>
        <button type="button" id="details-add" class="blue-button">Add to Cart</button>
      </div>
    </dialog>
  </body>
</html>
